name: Daily IDR Rate Tracker

# Trigger: Jalan setiap jam 00:00 UTC (sekitar jam 7 pagi WIB)
on:
  schedule:
    - cron: '0 0 * * *'
  # Opsi ini biar bisa kita jalankan manual buat ngetes
  workflow_dispatch:

# Izinkan bot melakukan push ke repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run ETL Script
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "Fajar Aji (Bot)"
        git config --global user.email "fajaraji2515@gmail.com"
        git add data/exchange_rates.csv
        git diff --staged --quiet || git commit -m "Auto-update: Daily Exchange Rate Data"
        git pull origin main --rebase
        git push origin main
